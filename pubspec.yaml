name: moi_virunthu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend + utilities
  supabase_flutter: ^2.5.6
  argon2: ^1.0.1
  intl: ^0.19.0      # FIXED ✔
  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  image_picker: ^1.0.7
  path: ^1.8.3

  # PDF-related libs
  printing: ^5.14.2        # used for printing & convertHtml
  pdf: ^3.11.3             # only needed for PdfPageFormat (convertHtml)
  syncfusion_flutter_pdf: ^31.2.15

  # Sharing + files
  share_plus: ^12.0.0

  # Image drawing (used for decoding asset PNG)
  image: any

  # WebView (for HTML preview)
  flutter_inappwebview: ^6.1.5

  # Permissions for WebView
  permission_handler: ^12.0.1

  # PDF Viewer for preview screen
  flutter_pdfview: ^1.4.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/money_transfer.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: NotoSerifTamil
      fonts:
        - asset: assets/fonts/NotoSerifTamil-Regular.ttf
        - asset: assets/fonts/NotoSerifTamil-Bold.ttf
          weight: 700
