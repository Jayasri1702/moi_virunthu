name: moi_virunthu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend + utilities
  supabase_flutter: ^2.5.6
  argon2: ^1.0.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  image_picker: ^1.0.7
  path: ^1.8.3
  flutter_local_notifications: ^17.0.0
  open_file: ^3.3.2
  connectivity_plus: ^6.0.0
  file_picker: ^8.0.0
  usb_serial: ^0.5.2

  # PDF-related libs
  printing: ^5.14.2
  pdf: ^3.11.3
  syncfusion_flutter_pdf: ^31.2.15

  # Sharing + files
  share_plus: ^12.0.0

  # Image drawing
  image: ^4.0.17

  # WebView
  flutter_inappwebview: ^6.1.5

  # Permissions
  permission_handler: ^12.0.1

  # PDF Viewer
  flutter_pdfview: ^1.4.3

  # Icons
  cupertino_icons: ^1.0.8

  # ✅ NEW: Thermal Printer Support
  blue_thermal_printer: ^1.2.1
  esc_pos_utils_plus: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/money_transfer.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: NotoSerifTamil
      fonts:
        - asset: assets/fonts/NotoSerifTamil-Regular.ttf
        - asset: assets/fonts/NotoSerifTamil-Bold.ttf
          weight: 700

    - family: Altroned
      fonts:
        - asset: assets/fonts/ALTRONED_Trial.ttf